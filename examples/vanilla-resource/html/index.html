<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; font: 15px/1.4 system-ui, sans-serif; color: #fff; }
  #root { position: relative; z-index: 1; height: 100%; }
  [data-glass] {
    position: absolute;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 16px 36px rgba(0, 0, 0, 0.3);
  }
  [data-glass-backdrop="bright"] { color: #111; }
  .panel { left: 50%; top: 50%; width: 420px; transform: translate(-50%, -50%); padding: 24px 26px; border-radius: 26px; }
  .panel h1 { margin: 0 0 8px; font-size: 22px; }
  .close { position: relative; margin-top: 16px; padding: 10px 20px; border-radius: 999px; display: inline-block; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>
<!-- Or copy dist/mri-liquid-glass.iife.min.js next to this file to work offline. -->
<script src="https://cdn.jsdelivr.net/npm/mri-fivem-liquid-glass/dist/mri-liquid-glass.iife.min.js"></script>
<script>
  MriLiquidGlass.startGameGlass();
  const root = document.getElementById('root');

  function render(open) {
    // Remove the markup when closed: the glass loop stops once no [data-glass] is left.
    root.innerHTML = open ? `
      <div class="panel" data-glass>
        <h1>Liquid glass</h1>
        <div>The game behind this panel is blurred live.</div>
        <div class="close" data-glass="liquid">Close</div>
      </div>` : '';
    root.querySelector('.close')?.addEventListener('click', () => {
      fetch(`https://${GetParentResourceName()}/close`, { method: 'POST', body: '{}' });
    });
  }

  window.addEventListener('message', (e) => {
    if (e.data?.action === 'toggle') render(e.data.open);
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') fetch(`https://${GetParentResourceName()}/close`, { method: 'POST', body: '{}' });
  });
</script>
</body>
</html>
