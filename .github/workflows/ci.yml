name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build library
        run: npm run build

      - name: Bundle size (minified single file at most 25 KB)
        run: |
          SIZE=$(stat -c %s dist/mri-liquid-glass.iife.min.js)
          echo "mri-liquid-glass.iife.min.js: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -le 25600

      - name: Validate registry
        run: npm run validate

      - name: Build site and API
        run: node scripts/build-data.mjs && npx vitepress build docs

      # Headless Chrome reads the glass canvas of the built playground pixel by pixel.
      - name: Visual test
        env:
          CHROME: google-chrome
          SHOT: playground.png
        run: npm test

      - name: Screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-screenshot
          path: playground.png
          if-no-files-found: ignore
